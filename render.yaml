databases:
  - name: kaamsetu-postgres
    databaseName: kaamsetu
    user: kaamsetu_user
    plan: free
    region: singapore

services:
  # =============================================================
  # Unified Full-Stack Application (Backend API + Customer & Worker Portals)
  # =============================================================
  - type: web
    name: kaamsetu-app
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run deploy:prod --workspace=@hyperlocal/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kaamsetu-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
