databases:
  - name: kaamsetu-postgres
    databaseName: kaamsetu
    user: kaamsetu_user
    plan: free
    region: singapore

services:
  # =============================================================
  # 1. Backend Web Service (Express + Socket.IO + Prisma)
  # =============================================================
  - type: web
    name: kaamsetu-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:server
    startCommand: npm run deploy:prod --workspace=@hyperlocal/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kaamsetu-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  # =============================================================
  # 2. Customer Application (React + Vite SPA)
  # =============================================================
  - type: static
    name: kaamsetu-customer
    buildCommand: npm install && npm run build:customer
    staticPublishPath: ./apps/customer/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false

  # =============================================================
  # 3. Worker Pro Application (React + Vite SPA)
  # =============================================================
  - type: static
    name: kaamsetu-worker
    buildCommand: npm install && npm run build:worker
    staticPublishPath: ./apps/worker/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
